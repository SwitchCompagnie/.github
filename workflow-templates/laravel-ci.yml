name: CI

on:
  push:
    branches: [$default-branch]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  laravel:
    name: Laravel
    uses: SwitchCompagnie/.github/.github/workflows/laravel-ci.yml@main
    with:
      php-versions: '["8.4", "8.5"]'
      database: sqlite
      # node-version: '22'
